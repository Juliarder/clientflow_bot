services:
  - type: web
    name: clientflow-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.admin:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_WEB_USERNAME
        value: admin
      - key: ADMIN_WEB_PASSWORD
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
